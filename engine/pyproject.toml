[project]
name = "catena-engine"
version = "0.1.0"
description = "Trace-driven Agent engineering control plane."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
catena-engine = "catena_engine.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catena_engine*"]

[project.optional-dependencies]
managed = ["opensandbox==1.2.0"]
evaluation = [
  "harbor==0.23.0",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools.package-data]
catena_engine = ["skills/*/SKILL.md"]
