name: Catena MVP1 CI

on:
  pull_request:
    paths:
      - "catena-web/**"
      - "control-plane/**"
      - "tap/**"
      - "engine/**"
      - "evals/**"
      - "deploy/catena-mvp1/**"
      - ".github/workflows/catena-mvp1-ci.yml"
  push:
    branches: [main]
    paths:
      - "catena-web/**"
      - "control-plane/**"
      - "tap/**"
      - "engine/**"
      - "evals/**"
      - "deploy/catena-mvp1/**"
      - ".github/workflows/catena-mvp1-ci.yml"

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install pinned Engine, Harness² and Harbor
        run: python -m pip install -e '.[dev,rsi]'
      - run: python -m pip check
      - run: ruff check catena_engine tests
      - name: Engine, real pinned Harness² and Harbor adapter contracts
        run: pytest
      - run: python ../evals/trace-skill-benchmark/validate_verifiers.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catena-web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: catena-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Verify Go embedded Web bundle is current
        run: diff -qr dist ../control-plane/internal/control/web

  control-plane:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.10.2.65-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: catena-ci-test-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catena_test
          POSTGRES_PASSWORD: catena-ci-test-only
          POSTGRES_DB: catena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catena_test -d catena_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BARENA_TEST_DATABASE_URL: postgres://catena_test:catena-ci-test-only@127.0.0.1:5432/catena_test?sslmode=disable
      CATENA_CLICKHOUSE_TEST_DSN: http://default:catena-ci-test-only@127.0.0.1:8123/default?dial_timeout=5s
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: control-plane/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/control
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cross-process Go queue, Python Engine and PostgreSQL protocol fixture
        run: |
          python -m venv /tmp/catena-pipeline
          /tmp/catena-pipeline/bin/pip install -e ../engine
          CATENA_ENGINE_TEST_PYTHON=/tmp/catena-pipeline/bin/python go test -race -run 'TestPostgresPrivatePythonPipelines|TestV2Migration' -v ./internal/control
      - name: Build and smoke pinned Engine image (no model calls)
        run: |
          docker build -f ../deploy/catena-mvp1/Dockerfile.engine -t catena-engine-v2 ..
          docker run --rm catena-engine-v2 codex --version
          docker run --rm catena-engine-v2 docker compose version
          docker run -d --name catena-engine-v2-smoke -e CATENA_ENGINE_TOKEN=fixture-private -p 18790:8790 catena-engine-v2
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18790/readyz; then break; fi
            sleep 1
          done
          curl -fsS -H 'Authorization: Bearer fixture-private' http://127.0.0.1:18790/v2/manifest
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18790/v2/manifest)" = 401

  tap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tap
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tap/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tap/codex/pnpm-lock.yaml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python -m compileall -q catena_tap scripts
      - run: pnpm --dir codex install --frozen-lockfile
      - run: pnpm --dir codex typecheck
      - run: pnpm --dir codex test
      - run: pnpm --dir codex build

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local Compose
        run: docker compose -f deploy/catena-mvp1/compose.yml config >/dev/null
      - name: Validate public Compose
        env:
          CATENA_DOMAIN: catena.example.com
          CATENA_GATEWAY_SECRET: 0123456789abcdef0123456789abcdef
          CATENA_API_TOKEN_SECRET: 1123456789abcdef0123456789abcdef
          CATENA_ENGINE_TOKEN: 6123456789abcdef0123456789abcdef
          CATENA_GITHUB_CLIENT_ID: test-client-id
          CATENA_GITHUB_CLIENT_SECRET: test-client-secret
          CATENA_POSTGRES_ADMIN_PASSWORD: 2123456789abcdef0123456789abcdef
          CATENA_CORE_DB_PASSWORD: 3123456789abcdef0123456789abcdef
          CATENA_CLICKHOUSE_PASSWORD: 5123456789abcdef0123456789abcdef
        run: docker compose -f deploy/catena-mvp1/compose.yml -f deploy/catena-mvp1/compose.public.yml config >/dev/null
      - name: Validate optional RSI and Memory overlays
        env:
          CATENA_RSI_WORKSPACE: /tmp/catena-rsi
          CATENA_DOCKER_GID: "998"
          CATENA_OPENVIKING_API_KEY: fixture-only
        run: |
          docker compose -f deploy/catena-mvp1/compose.yml -f deploy/catena-mvp1/compose.rsi.yml config >/dev/null
          docker compose -f deploy/catena-mvp1/compose.yml -f deploy/catena-mvp1/compose.openviking.yml config >/dev/null
