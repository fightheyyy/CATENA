name: Catena MVP1 CI

on:
  pull_request:
    paths:
      - "catena-web/**"
      - "control-plane/**"
      - "tap/**"
      - "engine/**"
      - "evals/**"
      - "deploy/catena-mvp1/**"
      - ".github/workflows/catena-mvp1-ci.yml"
  push:
    branches: [main]
    paths:
      - "catena-web/**"
      - "control-plane/**"
      - "tap/**"
      - "engine/**"
      - "evals/**"
      - "deploy/catena-mvp1/**"
      - ".github/workflows/catena-mvp1-ci.yml"

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install Engine and SDK rollback dependencies
        run: python -m pip install -e '.[dev,sdk]'
      - run: python -m pip check
      - name: Engine and SDK contract tests
        run: pytest --ignore=tests/test_codex_artifacts.py --ignore=tests/test_experiment_runtime.py --ignore=tests/test_harbor_bridge.py --ignore=tests/test_harbor_e2b.py
      - name: Install isolated Harbor test environment
        run: |
          python -m venv /tmp/catena-harbor-tests
          /tmp/catena-harbor-tests/bin/pip install -e '.[dev,evaluation-e2b]'
          /tmp/catena-harbor-tests/bin/pip check
      - name: Harbor, E2B adapters and SDK compatibility tests
        run: /tmp/catena-harbor-tests/bin/pytest
      - run: python ../evals/trace-skill-benchmark/validate_verifiers.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catena-web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: catena-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Verify Go embedded Web bundle is current
        run: diff -qr dist ../control-plane/internal/control/web

  control-plane:
    runs-on: ubuntu-latest
    services:
      codex-test-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: codex-test-only
          POSTGRES_DB: codex_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: control-plane/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/control
      - name: Build pinned Codex Engine
        run: |
          docker build -f ../deploy/catena-mvp1/Dockerfile.engine -t catena-engine-codex ..
          docker run -d --name codex-test-engine --add-host host.docker.internal:host-gateway -p 18790:8790 catena-engine-codex
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18790/readyz; then exit 0; fi
            sleep 1
          done
          docker logs codex-test-engine
          exit 1
      - name: Real CLI three-stage API and PostgreSQL acceptance
        env:
          CATENA_CODEX_ACCEPT_ENGINE_URL: http://127.0.0.1:18790
          CATENA_CODEX_ACCEPT_CALLBACK_HOST: host.docker.internal
          BARENA_TEST_DATABASE_URL: postgresql://postgres:codex-test-only@127.0.0.1:5432/codex_acceptance?sslmode=disable
        run: go test -run TestCodexEngineEvolutionAcceptance -v -timeout 10m ./internal/control

  tap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tap
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tap/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tap/codex/pnpm-lock.yaml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python -m compileall -q catena_tap scripts
      - run: pnpm --dir codex install --frozen-lockfile
      - run: pnpm --dir codex typecheck
      - run: pnpm --dir codex test
      - run: pnpm --dir codex build

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local Compose
        run: docker compose -f deploy/catena-mvp1/compose.yml config >/dev/null
      - name: Validate public Compose
        env:
          CATENA_DOMAIN: catena.example.com
          CATENA_GATEWAY_SECRET: 0123456789abcdef0123456789abcdef
          CATENA_API_TOKEN_SECRET: 1123456789abcdef0123456789abcdef
          CATENA_ENGINE_TOKEN: 6123456789abcdef0123456789abcdef
          CATENA_GITHUB_CLIENT_ID: test-client-id
          CATENA_GITHUB_CLIENT_SECRET: test-client-secret
          CATENA_POSTGRES_ADMIN_PASSWORD: 2123456789abcdef0123456789abcdef
          CATENA_CORE_DB_PASSWORD: 3123456789abcdef0123456789abcdef
          CATENA_CLICKHOUSE_PASSWORD: 5123456789abcdef0123456789abcdef
          XIAOBA_LLM_API_BASE: https://api.example.com/v1
          XIAOBA_LLM_API_KEY: test-model-key
          XIAOBA_LLM_MODEL: test-model
        run: docker compose -f deploy/catena-mvp1/compose.yml -f deploy/catena-mvp1/compose.public.yml config >/dev/null
      - name: Verify pinned worker sources
        run: |
          grep -Eq 'CATENA_BARENA_CONTEXT.*#' deploy/catena-mvp1/compose.yml
          grep -Eq 'CATENA_XIAOBA_CONTEXT.*#' deploy/catena-mvp1/compose.yml
