# Included by compose.yml. All receivers/brokers are private to the network.
services:
  kafka: &kafka
    image: apache/kafka:3.9.1
    hostname: kafka
    environment: &kafka-env
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_MESSAGE_MAX_BYTES: 33554432
      KAFKA_REPLICA_FETCH_MAX_BYTES: 33554432
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  kafka-2:
    <<: *kafka
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes: [kafka-2-data:/var/lib/kafka/data]
  kafka-3:
    <<: *kafka
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes: [kafka-3-data:/var/lib/kafka/data]
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, kafka:9092, --create, --if-not-exists, --topic, catena-traces-v1, --partitions, "6", --replication-factor, "3", --config, min.insync.replicas=2, --config, retention.ms=604800000]
    restart: on-failure
  clickhouse-migrate:
    image: clickhouse/clickhouse-server:25.10.2.65-alpine
    depends_on:
      clickhouse: {condition: service_healthy}
    environment:
      CLICKHOUSE_PASSWORD: ${CATENA_CLICKHOUSE_PASSWORD:-catena}
    volumes:
      - ./telemetry/migrations:/migrations:ro
      - ./telemetry/migrate.sh:/migrate.sh:ro
    entrypoint: [/bin/sh, /migrate.sh]
    restart: on-failure
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./telemetry/gateway.yaml:/etc/otelcol/config.yaml:ro]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    mem_limit: 256m
    restart: unless-stopped
  otel-consumer:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      CATENA_CLICKHOUSE_PASSWORD: ${CATENA_CLICKHOUSE_PASSWORD:-catena}
    volumes: [./telemetry/consumer.yaml:/etc/otelcol/config.yaml:ro]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      clickhouse-migrate: {condition: service_completed_successfully}
    mem_limit: 1g
    restart: unless-stopped
volumes:
  kafka-data:
  kafka-2-data:
  kafka-3-data:
