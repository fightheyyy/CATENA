receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 33554432
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
exporters:
  kafka:
    brokers: [kafka:9092, kafka-2:9092, kafka-3:9092]
    metadata:
      refresh_interval: 5s
    traces:
      topic: catena-traces-v1
      encoding: otlp_proto
    partition_traces_by_id: true
    producer:
      required_acks: -1
      compression: lz4
      max_message_bytes: 33554432
      allow_auto_topic_creation: false
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 200ms
      max_interval: 1s
      max_elapsed_time: 5s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [kafka]
