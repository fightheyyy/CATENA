name: catena

services:
  catena-core:
    build:
      context: ../..
      dockerfile: deploy/catena-mvp1/Dockerfile.core
    image: catena/core:mvp1
    environment:
      BARENA_SERVER_ADDR: 0.0.0.0:8787
      BARENA_ALLOW_REMOTE: "1"
      BARENA_INTERNAL_MODE: "1"
      BARENA_GATEWAY_SECRET: ${CATENA_GATEWAY_SECRET:-catena-local-demo-gateway-secret-change-me}
      BARENA_API_TOKEN_ENCRYPTION_KEY: ${CATENA_API_TOKEN_SECRET:-catena-local-api-token-secret-change-me}
      BARENA_GITHUB_CLIENT_ID: ${CATENA_GITHUB_CLIENT_ID:-}
      BARENA_GITHUB_CLIENT_SECRET: ${CATENA_GITHUB_CLIENT_SECRET:-}
      BARENA_GITHUB_REDIRECT_URL: ${CATENA_GITHUB_REDIRECT_URL:-}
      BARENA_DATABASE_URL: postgresql://catena_core:${CATENA_CORE_DB_PASSWORD:-catena-core-local}@postgres:5432/catena_core?sslmode=disable
      CATENA_CLICKHOUSE_DSN: ${CATENA_CLICKHOUSE_DSN:-http://default:catena@clickhouse:8123/catena?dial_timeout=5s}
      # Private analysis engine; never published outside the Compose network.
      CATENA_ENGINE_URL: http://catena-engine:8790
      CATENA_ENGINE_REQUEST_TIMEOUT: ${CATENA_ENGINE_REQUEST_TIMEOUT:-20m}
      CATENA_ENGINE_TOKEN: ${CATENA_ENGINE_TOKEN:-catena-local-engine-token-change-me}
      CATENA_JOB_WORKERS: ${CATENA_JOB_WORKERS:-1}
      CATENA_JOB_MAX_ATTEMPTS: ${CATENA_JOB_MAX_ATTEMPTS:-3}
      CATENA_JOB_LEASE_TTL: ${CATENA_JOB_LEASE_TTL:-30s}
      CATENA_JOB_HEARTBEAT: ${CATENA_JOB_HEARTBEAT:-5s}
      CATENA_JOB_POLL_INTERVAL: ${CATENA_JOB_POLL_INTERVAL:-500ms}
      CATENA_JOB_TIMEOUT: ${CATENA_JOB_TIMEOUT:-20m}
      CATENA_JOB_RETRY_BASE: ${CATENA_JOB_RETRY_BASE:-1s}
      CATENA_JOB_RETRY_MAX: ${CATENA_JOB_RETRY_MAX:-30s}
      CATENA_INGEST_CONCURRENCY: ${CATENA_INGEST_CONCURRENCY:-4}
      CATENA_INGEST_PER_OWNER: ${CATENA_INGEST_PER_OWNER:-2}
      CATENA_INGEST_MAX_SPANS: ${CATENA_INGEST_MAX_SPANS:-4096}
      CATENA_INGEST_TIMEOUT: ${CATENA_INGEST_TIMEOUT:-15s}
    ports:
      - "127.0.0.1:${CATENA_APP_PORT:-5570}:8787"
    volumes:
      - catena-data:/var/lib/catena
    depends_on:
      catena-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  catena-engine:
    build:
      context: ../..
      dockerfile: deploy/catena-mvp1/Dockerfile.engine
    image: catena/engine:mvp1
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    environment:
      CATENA_CODEX_REASONING_EFFORT: ${CATENA_CODEX_REASONING_EFFORT:-low}
      CATENA_ENGINE_EXECUTIONS_ROOT: /var/lib/catena-engine/executions
      CATENA_RSI_RUNS_ROOT: /var/lib/catena-engine/runs
      CATENA_RSI_CASES_MANIFEST: ${CATENA_RSI_CASES_MANIFEST:-}
      CATENA_ENGINE_ADDR: 0.0.0.0:8790
      CATENA_ENGINE_TOKEN: ${CATENA_ENGINE_TOKEN:-catena-local-engine-token-change-me}
    volumes:
      - catena-engine-data:/var/lib/catena-engine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CATENA_POSTGRES_ADMIN_PASSWORD:-catena-postgres-local}
      POSTGRES_DB: postgres
      CATENA_CORE_DB_PASSWORD: ${CATENA_CORE_DB_PASSWORD:-catena-core-local}
    ports:
      - "127.0.0.1:${CATENA_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-catena-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.10.2.65-alpine
    environment:
      CLICKHOUSE_DB: catena
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CATENA_CLICKHOUSE_PASSWORD:-catena}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CATENA_CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped


volumes:
  catena-engine-data:
  catena-data:
  postgres-data:
  clickhouse-data:
