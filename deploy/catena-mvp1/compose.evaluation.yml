# Explicit operator opt-in: Harbor requires Docker control of the host.
# Host and Engine paths MUST be identical for Harbor bind mounts.
services:
  catena-engine:
    environment:
      CATENA_CASES_MANIFEST: ${CATENA_EVALUATION_WORKSPACE:?set an absolute operator-owned workspace}/cases.json
      CATENA_RUNS_ROOT: ${CATENA_EVALUATION_WORKSPACE:?set an absolute operator-owned workspace}/runs
    volumes:
      - ${CATENA_EVALUATION_WORKSPACE:?set workspace}:${CATENA_EVALUATION_WORKSPACE:?set workspace}
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${CATENA_DOCKER_GID:?set host docker socket GID}
