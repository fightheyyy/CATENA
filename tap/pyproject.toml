[project]
name = "catena-tap"
version = "0.2.0"
description = "Parse Codex and Claude Code runtime evidence into Catena canonical OTLP traces."
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[project.scripts]
catena = "catena_tap.cli:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catena_tap"]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
